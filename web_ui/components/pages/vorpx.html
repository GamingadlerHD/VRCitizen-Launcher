<!-- VorpX Page Component -->
<div id="vorpx-page" class="page-component">
    <h1 class="text-3xl font-bold text-center text-sc-blue-light mb-8" data-i18n="vorpxframe">VorpX Configuration</h1>

    <div class="grid grid-cols-2 gap-8">
        <div class="bg-sc-bg-secondary rounded-lg p-6 border border-sc-border">
            <h3 class="text-lg font-semibold text-sc-blue-light mb-4" data-i18n="vorpxlefttitle">VR Settings</h3>
            <p class="text-sc-text-muted text-lg" data-i18n="coming_soon">-- Coming Soon --</p>
        </div>

        <div class="bg-sc-bg-secondary rounded-lg p-6 border border-sc-border">
            <h3 class="text-lg font-semibold text-sc-blue-light mb-4" data-i18n="vorpxrighttitle">VorpX Configuration
            </h3>
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <span class="text-sc-text text-sm" data-i18n="keepkeybinds">Keep Keybinds</span>
                    <div class="switch relative w-12 h-6 rounded-full cursor-pointer"
                        onclick="Components.toggleSwitch(this)" data-setting="keepKeybinds">
                        <div class="switch-thumb absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full"></div>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <span class="text-sc-text text-sm" data-i18n="customConfig">Custom Config</span>
                    <div class="switch relative w-12 h-6 rounded-full cursor-pointer"
                        onclick="Components.toggleSwitch(this)" data-setting="customConfig">
                        <div class="switch-thumb absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
